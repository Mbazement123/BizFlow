services:
  - type: web
    name: business-manager-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: REGISTRY_SHEET_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: TZ_NAME
        value: Africa/Lagos
