services:
  - type: web
    name: business-manager-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run migrate
    startCommand: node server.js
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_PUBLIC_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: TZ_NAME
        value: Africa/Lagos
